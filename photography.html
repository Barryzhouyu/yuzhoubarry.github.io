<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography | Yu (Barry) Zhou</title>
  <meta name="author" content="Yu Zhou">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦾</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --text: #1a1a1a; --muted: #5a5a5a; --link: #1772d0; --link-hover: #f09228; --bg: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: "Lato", Verdana, Helvetica, sans-serif; font-size: 15px; line-height: 1.55; }
    a { color: var(--link); text-decoration: none; }
    a:hover, a:focus { color: var(--link-hover); }
    .page { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 32px; font-weight: 400; margin: 8px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }

    /* Hover-to-expand strip */
    .strip { display: flex; gap: 8px; height: 520px; }
    .strip figure { flex: 1; min-width: 0; margin: 0; cursor: zoom-in;
                    border-radius: 10px; overflow: hidden; transition: flex 0.45s ease; }
    .strip figure:hover, .strip figure:focus { flex: 3; outline: none; }
    .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Lightbox */
    .lb { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none;
          align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
    .lb.open { display: flex; }
    .lb img { max-width: 94vw; max-height: 92vh; border-radius: 6px; }

    @media (max-width: 640px) {
      .strip { height: 380px; }
    }
  </style>
</head>
<body>
<div class="page">
  <a href="./">&larr; Back to home</a>
  <h1>Photography</h1>
  <p class="sub">Hover to expand, click to view full size.</p>

  <div class="strip">
    <figure tabindex="0"><img src="card_dome.webp" alt="Golden Dome at Notre Dame"></figure>
    <figure tabindex="0"><img src="card_wheel.webp" alt="Ferris wheel on Santa Monica Pier"></figure>
  </div>
</div>

<div class="lb" id="lb"><img alt=""></div>
<script>
  const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
  const imgs = [...document.querySelectorAll('.strip img')];
  let i = 0;
  const show = k => { i = (k + imgs.length) % imgs.length; lbImg.src = imgs[i].src; lbImg.alt = imgs[i].alt; lb.classList.add('open'); };
  imgs.forEach((im, k) => im.parentElement.addEventListener('click', () => show(k)));
  lb.addEventListener('click', () => lb.classList.remove('open'));
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
</script>
</body>
</html>
