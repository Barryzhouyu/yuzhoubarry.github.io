    :root { --text: #1a1a1a; --muted: #5a5a5a; --link: #1772d0; --link-hover: #f09228; --bg: #ffffff; --row: 260px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: "Lato", Verdana, Helvetica, sans-serif; font-size: 15px; line-height: 1.55; }
    a { color: var(--link); text-decoration: none; }
    a:hover, a:focus { color: var(--link-hover); }
    .page { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 32px; font-weight: 400; margin: 8px 0 4px; }
    h2 { font-size: 22px; font-weight: 400; margin: 36px 0 12px; }
    .sub { color: var(--muted); margin: 0; }

    /* Justified rows: every photo in a row has the same height, nothing is cropped */
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .grid::after { content: ""; flex-grow: 999999; }
    .ph { flex-grow: calc(var(--r) * 100); flex-basis: calc(var(--r) * var(--row)); display: block; cursor: zoom-in; }
    .ph img { display: block; width: 100%; height: auto; aspect-ratio: var(--r); background: #eee; }

    /* Lightbox */
    .lb { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); display: none;
          align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
    .lb.open { display: flex; }
    .lb img { max-width: 96vw; max-height: 94vh; }

    @media (max-width: 640px) {
      :root { --row: 150px; }
      .grid { gap: 4px; }
    }
  </style>
</head>

<div class="lb" id="lb"><img alt=""></div>
<script>
  const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
  const links = [...document.querySelectorAll('.ph')];
  let i = 0;
  const show = k => {
    i = (k + links.length) % links.length;
    const a = links[i];
    lbImg.src = a.querySelector('img').src;          // instant preview
    const full = new Image();
    full.onload = () => { if (links[i] === a) lbImg.src = full.src; };
    full.src = a.href;                               // swap in the original if it exists
    lb.classList.add('open');
  };
  links.forEach((a, k) => a.addEventListener('click', e => { e.preventDefault(); show(k); }));
  lb.addEventListener('click', () => lb.classList.remove('open'));
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
</script>
